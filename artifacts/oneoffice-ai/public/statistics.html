<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Statistics · OneOffice AI</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#020617;color:#e2e8f0}
    *{box-sizing:border-box}body{margin:0;background:#020617;min-height:100vh}.page{max-width:1400px;margin:0 auto;padding:28px 28px 64px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.heading h1{margin:0;color:#fff;font-size:21px;font-weight:600;letter-spacing:-.02em}.heading p{margin:4px 0 0;color:#64748b;font-size:12px}.actions{display:flex;align-items:center;gap:8px}.select,.action{appearance:none;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#e2e8f0;border-radius:12px;padding:10px 13px;outline:none}.select{min-width:160px}.action{cursor:pointer}.action:hover,.select:hover{background:rgba(255,255,255,.09);border-color:rgba(167,139,250,.35)}
    .hero,.card,.panel{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);backdrop-filter:blur(18px);border-radius:20px}.hero{padding:20px;margin-bottom:16px}.heroRow{display:flex;align-items:center;justify-content:space-between;gap:16px}.channel{display:flex;align-items:center;gap:13px;min-width:0}.avatar{width:50px;height:50px;border-radius:15px;object-fit:cover;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}.channel h2{font-size:17px;color:#fff;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.channel p{margin:4px 0 0;color:#64748b;font-size:12px}.updated{color:#64748b;font-size:11px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.card{padding:16px;min-width:0}.label{font-size:11px;color:#64748b;margin-bottom:8px}.value{font-size:23px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{font-size:11px;color:#64748b;margin-top:5px}.two{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(300px,1fr);gap:14px;margin-bottom:14px}.panel{padding:18px;min-width:0}.panel h3{margin:0;color:#fff;font-size:14px;font-weight:600}.sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.muted{color:#64748b;font-size:11px}.chart{height:290px;position:relative}.chart svg{width:100%;height:100%;overflow:visible}.axis{fill:#64748b;font-size:10px}.line{fill:none;stroke:#a78bfa;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.area{fill:url(#fill);opacity:.38}.dot{fill:#a78bfa}.chartGrid{stroke:rgba(255,255,255,.06);stroke-width:1}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:620px}.table th,.table td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px;text-align:left;vertical-align:middle}.table th{color:#64748b;font-weight:500}.table td{color:#cbd5e1}.table tr:last-child td{border-bottom:0}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:rgba(16,185,129,.1);color:#34d399;border:1px solid rgba(16,185,129,.2);font-size:10px}.notice,.error{padding:14px;border-radius:14px;font-size:12px;line-height:1.55}.notice{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);color:#fcd34d}.error{background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.2);color:#fda4af}.empty{padding:44px 20px;text-align:center;border:1px dashed rgba(255,255,255,.12);border-radius:18px;color:#64748b}.loading{display:flex;align-items:center;justify-content:center;padding:90px;color:#94a3b8}.spinner{width:22px;height:22px;border:2px solid rgba(255,255,255,.15);border-top-color:#a78bfa;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.miniGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.mini{padding:13px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06)}.mini .k{font-size:10px;color:#64748b}.mini .v{font-size:15px;color:#fff;font-weight:600;margin-top:4px}.videoTitle{max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thumb{width:88px;height:50px;object-fit:cover;border-radius:8px;background:rgba(255,255,255,.05)}
    @media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.select{flex:1}.heroRow{align-items:flex-start;flex-direction:column}}
    @media(max-width:560px){.page{padding:18px 12px 44px}.grid{grid-template-columns:1fr 1fr;gap:8px}.card{padding:13px}.value{font-size:18px}.panel{padding:13px}.chart{height:230px}.heading h1{font-size:18px}.actions{flex-wrap:wrap}.select{min-width:140px}.action{padding:9px 11px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div class="heading"><h1>Statistics</h1><p>Real API data from connected services</p></div>
      <div class="actions">
        <select id="connector" class="select" aria-label="Connector">
          <option value="youtube">YouTube</option>
          <option value="telegram">Telegram</option>
          <option value="instagram">Instagram</option>
          <option value="vk">VK</option>
        </select>
        <button id="refresh" class="action">↻ Refresh</button>
        <button id="back" class="action">← Close</button>
      </div>
    </header>
    <section id="app"></section>
  </main>
  <script type="module" src="/statistics.js"></script>
</body>
</html>
