<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Statistics · OneOffice AI</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#020617;color:#e2e8f0}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,rgba(124,58,237,.18),transparent 32%),radial-gradient(circle at 90% 10%,rgba(37,99,235,.14),transparent 30%),#020617;min-height:100vh}
    button,select{font:inherit}button{cursor:pointer}.page{max-width:1280px;margin:0 auto;padding:22px 22px 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:42px;height:42px;border-radius:13px}.brand h1{margin:0;color:#fff;font-size:21px}.brand p{margin:3px 0 0;color:#64748b;font-size:12px}.actions{display:flex;align-items:center;gap:10px}.select{appearance:none;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);color:#fff;border-radius:12px;padding:10px 34px 10px 13px;min-width:170px;outline:none}.back,.refresh{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#cbd5e1;border-radius:12px;padding:10px 13px}.back:hover,.refresh:hover{background:rgba(255,255,255,.09)}
    .hero{border:1px solid rgba(255,255,255,.1);background:rgba(15,23,42,.72);backdrop-filter:blur(18px);border-radius:22px;padding:20px;margin-bottom:18px}.heroRow{display:flex;align-items:center;justify-content:space-between;gap:16px}.channel{display:flex;align-items:center;gap:12px;min-width:0}.avatar{width:52px;height:52px;border-radius:16px;object-fit:cover;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}.channel h2{font-size:18px;color:#fff;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.channel p{margin:4px 0 0;color:#64748b;font-size:12px}.updated{color:#64748b;font-size:11px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.card{border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.035);border-radius:18px;padding:16px;min-width:0}.label{font-size:11px;color:#64748b;margin-bottom:9px}.value{font-size:23px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{font-size:11px;color:#64748b;margin-top:5px}.two{display:grid;grid-template-columns:1.7fr 1fr;gap:14px;margin-bottom:18px}.panel{border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.035);border-radius:18px;padding:18px;min-width:0}.panel h3{margin:0 0 14px;color:#fff;font-size:14px}.chart{height:290px;position:relative}.chart svg{width:100%;height:100%;overflow:visible}.axis{fill:#64748b;font-size:10px}.line{fill:none;stroke:#a78bfa;stroke-width:2.5}.area{fill:url(#fill);opacity:.35}.dot{fill:#a78bfa}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.06);font-size:12px;text-align:left}.table th{color:#64748b;font-weight:500}.table td{color:#cbd5e1}.table tr:last-child td{border-bottom:0}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;background:rgba(16,185,129,.1);color:#34d399;border:1px solid rgba(16,185,129,.2);font-size:10px}.notice{padding:15px;border-radius:14px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);color:#fcd34d;font-size:12px;line-height:1.55}.error{padding:15px;border-radius:14px;background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.2);color:#fda4af;font-size:12px}.empty{padding:48px 20px;text-align:center;border:1px dashed rgba(255,255,255,.12);border-radius:18px;color:#64748b}.loading{display:flex;align-items:center;justify-content:center;padding:70px;color:#94a3b8}.spinner{width:22px;height:22px;border:2px solid rgba(255,255,255,.15);border-top-color:#a78bfa;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 10px}.sectionTitle h3{margin:0;color:#fff;font-size:14px}.muted{color:#64748b;font-size:11px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:10px;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:#94a3b8}
    @media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.actions{width:100%}.select{flex:1}.back,.refresh{white-space:nowrap}.heroRow{align-items:flex-start;flex-direction:column}}
    @media(max-width:520px){.page{padding:14px 12px 40px}.grid{grid-template-columns:1fr 1fr;gap:8px}.card{padding:13px}.value{font-size:19px}.panel{padding:13px}.chart{height:220px}.brand h1{font-size:18px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div class="brand"><img src="/brand-logo.png" alt="OneOffice AI"/><div><h1>Detailed Statistics</h1><p>Real API data from connected services</p></div></div>
      <div class="actions">
        <select id="connector" class="select" aria-label="Connector">
          <option value="youtube">YouTube</option>
          <option value="telegram">Telegram</option>
          <option value="instagram">Instagram</option>
          <option value="vk">VK</option>
        </select>
        <button id="refresh" class="refresh">↻ Refresh</button>
        <button id="back" class="back">← Profile</button>
      </div>
    </header>
    <section id="app"></section>
  </main>
  <script type="module" src="/statistics.js"></script>
</body>
</html>
