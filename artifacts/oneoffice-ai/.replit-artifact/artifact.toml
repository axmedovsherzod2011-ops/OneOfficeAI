kind = "web"
previewPath = "/"
title = "OneOffice AI"
version = "1.0.0"
id = "artifacts/oneoffice-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24444

[services.development]
run = "pnpm --filter @workspace/oneoffice-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/oneoffice-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/oneoffice-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24444"
BASE_PATH = "/"
