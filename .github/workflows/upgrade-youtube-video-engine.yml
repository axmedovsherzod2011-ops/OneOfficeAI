name: upgrade-youtube-video-engine
on:
  push:
    branches: [chore/remove-replit]
    paths:
      - '.github/workflows/upgrade-youtube-video-engine.yml'
      - '.github/upgrade-youtube-video-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Patch video engine
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkgPath = 'artifacts/api-server/package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.dependencies['node-edge-tts'] = '^1.2.10';
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const file = 'artifacts/api-server/src/routes/youtube.ts';
          let s = fs.readFileSync(file, 'utf8');
          if (!s.includes('from "node-edge-tts"')) {
            s = s.replace('import { generateText } from "../ai/textProviders";', 'import { generateText } from "../ai/textProviders";\nimport { EdgeTTS } from "node-edge-tts";');
          }
          const start = s.indexOf('function writeMarketingWav(');
          const upload = s.indexOf('async function uploadToYouTube(', start);
          if (start < 0 || upload < 0) throw new Error('video builder block not found');
          const block = String.raw`function writeMarketingWav(outputPath: string) {
  const sampleRate = 44100;
  const seconds = 15;
  const frames = sampleRate * seconds;
  const channels = 2;
  const bitsPerSample = 16;
  const dataSize = frames * channels * 2;
  const buffer = Buffer.alloc(44 + dataSize);
  const writeString = (offset: number, value: string) => buffer.write(value, offset, 'ascii');
  writeString(0, 'RIFF'); buffer.writeUInt32LE(36 + dataSize, 4); writeString(8, 'WAVE');
  writeString(12, 'fmt '); buffer.writeUInt32LE(16, 16); buffer.writeUInt16LE(1, 20);
  buffer.writeUInt16LE(channels, 22); buffer.writeUInt32LE(sampleRate, 24);
  buffer.writeUInt32LE(sampleRate * channels * 2, 28); buffer.writeUInt16LE(channels * 2, 32);
  buffer.writeUInt16LE(bitsPerSample, 34); writeString(36, 'data'); buffer.writeUInt32LE(dataSize, 40);
  const roots = [220, 233, 247, 262, 277, 294, 311, 330];
  const scales = [0, 2, 4, 7, 9, 12, 14];
  const root = roots[Math.floor(Math.random() * roots.length)];
  const tempo = 112 + Math.floor(Math.random() * 24);
  const beat = 60 / tempo;
  const progression = [0, 5, 3, 4];
  const melody = Array.from({ length: 64 }, () => scales[Math.floor(Math.random() * scales.length)]);
  const freq = (semitones: number) => root * Math.pow(2, semitones / 12);
  const envelope = (t: number, duration: number) => {
    const attack = Math.min(0.025, duration * 0.2);
    const release = Math.min(0.09, duration * 0.35);
    if (t < 0 || t > duration) return 0;
    if (t < attack) return t / attack;
    if (t > duration - release) return Math.max(0, (duration - t) / release);
    return 1;
  };
  let peak = 0;
  const samples = new Float32Array(frames * 2);
  for (let i = 0; i < frames; i++) {
    const t = i / sampleRate;
    const beatIndex = Math.floor(t / beat);
    const beatT = t % beat;
    const chordRoot = progression[Math.floor((beatIndex % 8) / 2)] ?? 0;
    let left = 0, right = 0;
    for (const interval of [chordRoot, chordRoot + 4, chordRoot + 7]) {
      const f = freq(interval);
      const pad = 0.055 * (Math.sin(2 * Math.PI * f * t) + 0.35 * Math.sin(2 * Math.PI * 2 * f * t));
      left += pad; right += pad * 0.96;
    }
    const bassDur = beat * 0.72;
    if (beatT < bassDur) {
      const f = freq(chordRoot - 12);
      const bass = 0.18 * envelope(beatT, bassDur) * Math.sin(2 * Math.PI * f * beatT);
      left += bass; right += bass;
    }
    const noteT = t % (beat / 2);
    const note = melody[Math.floor(t / (beat / 2)) % melody.length];
    if (noteT < beat * 0.42) {
      const f = freq(note + 12);
      const lead = 0.09 * envelope(noteT, beat * 0.42) * Math.sin(2 * Math.PI * f * noteT);
      left += lead * 0.94; right += lead;
    }
    if (beatT < 0.16) {
      const a = Math.exp(-beatT * 24);
      const f = 105 - 55 * Math.min(1, beatT / 0.16);
      const kick = 0.18 * a * Math.sin(2 * Math.PI * f * beatT);
      left += kick; right += kick;
    }
    const hatT = t % (beat / 2);
    if (hatT < 0.045) {
      const noise = (Math.random() * 2 - 1) * 0.028 * Math.exp(-hatT * 90);
      left += noise; right += noise * 0.9;
    }
    const fade = Math.min(1, t / 0.08, (seconds - t) / 0.12);
    const idx = i * 2;
    samples[idx] = left * Math.max(0, fade);
    samples[idx + 1] = right * Math.max(0, fade);
    peak = Math.max(peak, Math.abs(samples[idx]), Math.abs(samples[idx + 1]));
  }
  const gain = peak > 0 ? Math.min(0.82 / peak, 1.8) : 1;
  for (let i = 0; i < samples.length; i++) {
    const value = Math.max(-1, Math.min(1, samples[i] * gain));
    buffer.writeInt16LE(Math.round(value * 32767), 44 + i * 2);
  }
  return writeFile(outputPath, buffer);
}

function createNarrationText(product: any) {
  const name = String(product.name ?? '').trim();
  const category = String(product.category ?? '').trim();
  const description = String(product.description ?? '').replace(/\s+/g, ' ').trim();
  const firstSentence = description.split(/[.!?]/)[0]?.trim() ?? '';
  const parts = [name, category ? `Kategoriya: ${category}` : '', firstSentence].filter(Boolean);
  return parts.join('. ').slice(0, 420) || 'Bu mahsulot haqida qisqa ma’lumot.';
}

function escapeDrawText(value: string) {
  return value.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/:/g, '\\:').replace(/%/g, '\\%').replace(/,/g, '\\,');
}

function buildTwoWordCues(subtitles: Array<{ part: string; start: number; end: number }>) {
  const words = subtitles.map((cue) => ({ text: String(cue.part ?? '').trim(), start: Number(cue.start), end: Number(cue.end) })).filter((cue) => cue.text);
  const cues: Array<{ text: string; start: number; end: number }> = [];
  for (let i = 0; i < words.length; i += 2) {
    const text = [words[i]?.text, words[i + 1]?.text].filter(Boolean).join(' ').trim();
    if (text) cues.push({ text: text.slice(0, 80), start: words[i].start, end: words[Math.min(i + 1, words.length - 1)].end });
  }
  return cues;
}

async function buildMarketingVideo(imagePath: string, outputPath: string, product: any, isShort: boolean) {
  const [w, h] = isShort ? [1080, 1920] : [1920, 1080];
  const vfBase = `scale=${w}:${h}:force_original_aspect_ratio=decrease,pad=${w}:${h}:(ow-iw)/2:(oh-ih)/2,setsar=1,format=yuv420p`;
  const dir = join(tmpdir(), `oneoffice-video-${Date.now()}-${Math.random().toString(36).slice(2)}`);
  mkdirSync(dir, { recursive: true });
  const musicPath = join(dir, 'music.wav');
  const voicePath = join(dir, 'voice.mp3');
  const subtitlePath = `${voicePath}.json`;
  try {
    await writeMarketingWav(musicPath);
    const narration = createNarrationText(product);
    const voices = ['uz-UZ-MadinaNeural', 'uz-UZ-SardorNeural'];
    const voice = voices[Math.floor(Math.random() * voices.length)];
    const tts = new EdgeTTS({ voice, lang: 'uz-UZ', outputFormat: 'audio-24khz-96kbitrate-mono-mp3', saveSubtitles: true, rate: '+4%', timeout: 20000 });
    await tts.ttsPromise(narration, voicePath);
    const rawSubs = JSON.parse(await readFile(subtitlePath, 'utf8')) as Array<{ part: string; start: number; end: number }>;
    const cues = buildTwoWordCues(rawSubs).filter((cue) => cue.start < 15000 && cue.end > 0).map((cue) => ({ ...cue, start: Math.max(0, cue.start) / 1000, end: Math.min(15000, cue.end) / 1000 }));
    const draw = cues.map((cue) => `drawtext=text='${escapeDrawText(cue.text)}':fontcolor=white:fontsize=${isShort ? 72 : 54}:font='DejaVu Sans':borderw=3:bordercolor=black@0.65:box=1:boxcolor=black@0.48:boxborderw=18:x=(w-text_w)/2:y=h*0.80:enable='between(t,${cue.start.toFixed(3)},${cue.end.toFixed(3)})'`).join(',');
    const vf = draw ? `${vfBase},${draw}` : vfBase;
    const args = [
      '-loop', '1', '-i', imagePath, '-i', musicPath, '-i', voicePath,
      '-filter_complex', `[1:a]volume=0.18[music];[2:a]volume=1.0[voice];[music][voice]amix=inputs=2:duration=longest:dropout_transition=0:normalize=0[audio]`,
      '-map', '0:v:0', '-map', '[audio]', '-vf', vf, '-t', '15', '-r', '30',
      '-c:v', 'libx264', '-preset', 'ultrafast', '-crf', '27',
      '-c:a', 'aac', '-b:a', '128k', '-ar', '44100', '-ac', '2',
      '-shortest', '-movflags', '+faststart', '-y', outputPath,
    ];
    await execFileAsync('ffmpeg', args, { timeout: 120_000 });
  } finally {
    await rm(dir, { recursive: true, force: true }).catch(() => {});
  }
}

`;
          s = s.slice(0, start) + block + s.slice(upload);
          s = s.replace(/buildFiveSecondVideo\(imagePath, videoPath, isShort\)/g, 'buildMarketingVideo(imagePath, videoPath, product, isShort)');
          s = s.replace(/where\(and\(eq\(youtubeProductContentsTable\.productId, productId\), eq\(youtubeProductContentsTable\.contentHash, contentHash\), eq\(youtubeProductContentsTable\.isShort, (?:isShort|Boolean\(isShort\))\)\)\)/g, 'where(and(eq(youtubeProductContentsTable.productId, productId), eq(youtubeProductContentsTable.isShort, Boolean(isShort))))');
          s = s.replace(/where\(and\(eq\(youtubeProductContentsTable\.productId, body\.productId\), eq\(youtubeProductContentsTable\.contentHash, contentHash\), eq\(youtubeProductContentsTable\.isShort, isShort\)\)\)/g, 'where(and(eq(youtubeProductContentsTable.productId, body.productId), eq(youtubeProductContentsTable.isShort, isShort)))');
          fs.writeFileSync(file, s);
          NODE
          rm -f .github/upgrade-youtube-video-trigger.txt
          pnpm install --lockfile-only
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/package.json pnpm-lock.yaml artifacts/api-server/src/routes/youtube.ts .github/upgrade-youtube-video-trigger.txt
          git rm .github/workflows/upgrade-youtube-video-engine.yml
          git commit -m 'feat: upgrade YouTube videos to 15s voice and cached captions'
          git push
