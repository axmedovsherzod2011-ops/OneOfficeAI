name: one-time-youtube-video-engine-fix
on:
  push:
    branches: [chore/remove-replit]
    paths:
      - '.github/upgrade-youtube-video-trigger.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-replit
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply clean engine integration
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkgPath = 'artifacts/api-server/package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.dependencies['node-edge-tts'] = '^1.2.10';
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const file = 'artifacts/api-server/src/routes/youtube.ts';
          let s = fs.readFileSync(file, 'utf8');
          if (!s.includes('from "../video/video-engine"')) {
            s = s.replace('import { generateText } from "../ai/textProviders";', 'import { generateText } from "../ai/textProviders";\nimport { buildMarketingVideo, VIDEO_DURATION_SECONDS } from "../video/video-engine";');
          }
          const start = s.indexOf('function writeMarketingWav(');
          const end = s.indexOf('async function uploadToYouTube(', start);
          if (start < 0 || end < 0) throw new Error('VIDEO_ENGINE_MARKERS_NOT_FOUND');
          s = s.slice(0, start) + 'async function buildFiveSecondVideo(imagePath: string, outputPath: string, isShort: boolean, product: any) {\n  await buildMarketingVideo(imagePath, outputPath, product, isShort);\n}\n\n' + s.slice(end);

          s = s.replace('buildFiveSecondVideo(previewImagePath, previewVideoPath, Boolean(isShort))', 'buildFiveSecondVideo(previewImagePath, previewVideoPath, Boolean(isShort), product)');
          s = s.replace('buildFiveSecondVideo(imagePath, videoPath, isShort)', 'buildFiveSecondVideo(imagePath, videoPath, isShort, product)');
          s = s.replace('buildFiveSecondVideo(imagePath, videoPath, Boolean(isShort))', 'buildFiveSecondVideo(imagePath, videoPath, Boolean(isShort), product)');

          // Video reuse is keyed by product + format. Metadata may vary, but the rendered product video is reusable.
          const previewQuery = 'let [cached] = await db.select().from(youtubeProductContentsTable).where(and(eq(youtubeProductContentsTable.productId, productId), eq(youtubeProductContentsTable.contentHash, contentHash), eq(youtubeProductContentsTable.isShort, isShort))).limit(1);';
          if (s.includes(previewQuery)) {
            s = s.replace(previewQuery, 'let [cached] = await db.select().from(youtubeProductContentsTable).where(and(eq(youtubeProductContentsTable.productId, productId), eq(youtubeProductContentsTable.isShort, isShort))).orderBy(sql`updated_at DESC`).limit(1);');
          }
          const publishQuery = 'let [cached] = await db.select().from(youtubeProductContentsTable).where(and(eq(youtubeProductContentsTable.productId, body.productId), eq(youtubeProductContentsTable.contentHash, contentHash), eq(youtubeProductContentsTable.isShort, isShort))).limit(1);';
          if (s.includes(publishQuery)) {
            s = s.replace(publishQuery, 'let [cached] = await db.select().from(youtubeProductContentsTable).where(and(eq(youtubeProductContentsTable.productId, body.productId), eq(youtubeProductContentsTable.isShort, isShort))).orderBy(sql`updated_at DESC`).limit(1);');
          }
          s = s.replace(/durationSeconds: 5/g, 'durationSeconds: VIDEO_DURATION_SECONDS');
          fs.writeFileSync(file, s);
          NODE
          pnpm install --lockfile-only
          pnpm --filter @workspace/api-server typecheck
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/package.json pnpm-lock.yaml artifacts/api-server/src/routes/youtube.ts artifacts/api-server/src/video/video-engine.ts
          git commit -m 'feat: clean 15s YouTube video engine with TTS and cache'
          git push
          git rm -f .github/upgrade-youtube-video-trigger.txt .github/workflows/upgrade-youtube-video-engine.yml
          git commit -m 'chore: remove one-time video engine workflow'
          git push
