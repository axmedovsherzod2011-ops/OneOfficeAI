name: one-time-youtube-video-engine-fix
on:
  push:
    branches: [chore/remove-replit]
    paths: ['.github/upgrade-youtube-video-trigger.txt']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-replit
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - name: Finalize integration
        shell: bash
        run: |
          set -e
          node - <<'NODE'
          const fs=require('fs');
          const file='artifacts/api-server/src/routes/youtube.ts';
          let s=fs.readFileSync(file,'utf8');
          s=s.replace('buildFiveSecondVideo(imagePath, videoPath, isShort)', 'buildFiveSecondVideo(imagePath, videoPath, isShort, product)');
          s=s.replace('and(eq(youtubeProductContentsTable.productId, body.productId), eq(youtubeProductContentsTable.contentHash, contentHash), eq(youtubeProductContentsTable.isShort, isShort))','and(eq(youtubeProductContentsTable.productId, body.productId), eq(youtubeProductContentsTable.isShort, isShort))');
          s=s.replace('5 soniyalik YouTube Short','15 soniyalik YouTube Short').replace('5 soniyalik YouTube video','15 soniyalik YouTube video');
          s=s.replace('videoCached: Boolean(cached?.videoData)','videoCached: Boolean(cached?.videoData?.startsWith("v3:"))');
          fs.writeFileSync(file,s);
          NODE
          pnpm install --lockfile-only
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/routes/youtube.ts pnpm-lock.yaml
          git commit -m 'fix: finish reusable 15s YouTube video integration'
          git push origin HEAD:chore/remove-replit
