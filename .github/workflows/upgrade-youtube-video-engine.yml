name: upgrade-youtube-video-engine
on:
  push:
    branches: [chore/remove-replit]
    paths:
      - '.github/workflows/upgrade-youtube-video-engine.yml'
      - '.github/upgrade-youtube-video-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-replit
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Patch YouTube video engine
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkgPath = 'artifacts/api-server/package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.dependencies['node-edge-tts'] = '^1.2.10';
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          const file = 'artifacts/api-server/src/routes/youtube.ts';
          let s = fs.readFileSync(file, 'utf8');
          if (!s.includes('from "node-edge-tts"')) s=s.replace('import { generateText } from "../ai/textProviders";','import { generateText } from "../ai/textProviders";\nimport { EdgeTTS } from "node-edge-tts";');
          const start=s.indexOf('function writeMarketingWav('), end=s.indexOf('async function uploadToYouTube(',start);
          if(start<0||end<0) throw new Error('VIDEO_BUILDER_NOT_FOUND');
          const block=String.raw`const VIDEO_DURATION_SECONDS=15;
const VIDEO_CACHE_VERSION='v2';
function writeMarketingWav(outputPath:string){const sr=44100,sec=15,frames=sr*sec,channels=2,dataSize=frames*channels*2,b=Buffer.alloc(44+dataSize),ws=(o:number,v:string)=>b.write(v,o,'ascii');ws(0,'RIFF');b.writeUInt32LE(36+dataSize,4);ws(8,'WAVE');ws(12,'fmt ');b.writeUInt32LE(16,16);b.writeUInt16LE(1,20);b.writeUInt16LE(channels,22);b.writeUInt32LE(sr,24);b.writeUInt32LE(sr*channels*2,28);b.writeUInt16LE(channels*2,32);b.writeUInt16LE(16,34);ws(36,'data');b.writeUInt32LE(dataSize,40);const roots=[220,233,247,262,277,294,311,330],scale=[0,2,4,7,9,12,14],root=roots[Math.floor(Math.random()*roots.length)],tempo=112+Math.floor(Math.random()*24),beat=60/tempo,prog=[0,5,3,4],mel=Array.from({length:64},()=>scale[Math.floor(Math.random()*scale.length)]),freq=(n:number)=>root*Math.pow(2,n/12),env=(t:number,d:number)=>{const a=Math.min(.025,d*.2),r=Math.min(.09,d*.35);if(t<0||t>d)return 0;if(t<a)return t/a;if(t>d-r)return Math.max(0,(d-t)/r);return 1;};const sm=new Float32Array(frames*2);let peak=0;for(let i=0;i<frames;i++){const t=i/sr,bi=Math.floor(t/beat),bt=t%beat,cr=prog[Math.floor((bi%8)/2)]??0;let l=0,r=0;for(const n of [cr,cr+4,cr+7]){const f=freq(n),p=.055*(Math.sin(2*Math.PI*f*t)+.35*Math.sin(2*Math.PI*f*2*t));l+=p;r+=p*.96;}const bd=beat*.72;if(bt<bd){const x=.18*env(bt,bd)*Math.sin(2*Math.PI*freq(cr-12)*bt);l+=x;r+=x;}const nt=t%(beat/2),note=mel[Math.floor(t/(beat/2))%mel.length];if(nt<beat*.42){const x=.09*env(nt,beat*.42)*Math.sin(2*Math.PI*freq(note+12)*nt);l+=x*.94;r+=x;}if(bt<.16){const x=.18*Math.exp(-bt*24)*Math.sin(2*Math.PI*(105-55*Math.min(1,bt/.16))*bt);l+=x;r+=x;}const ht=t%(beat/2);if(ht<.045){const x=(Math.random()*2-1)*.028*Math.exp(-ht*90);l+=x;r+=x*.9;}const fade=Math.max(0,Math.min(1,t/.08,(sec-t)/.12));l*=fade;r*=fade;sm[i*2]=l;sm[i*2+1]=r;peak=Math.max(peak,Math.abs(l),Math.abs(r));}const gain=peak?Math.min(.82/peak,1.8):1;for(let i=0;i<sm.length;i++)b.writeInt16LE(Math.round(Math.max(-1,Math.min(1,sm[i]*gain))*32767),44+i*2);return writeFile(outputPath,b);}
function narrationForProduct(p:any){const n=String(p.name??'').replace(/\s+/g,' ').trim(),d=String(p.description??'').replace(/\s+/g,' ').trim(),first=d.split(/[.!?]/)[0]?.trim()??'',price=p.sellPrice!=null&&p.currency?`Narxi ${p.sellPrice} ${p.currency}`:'';return [n,first,price].filter(Boolean).join('. ').slice(0,360);}
function escapeDrawText(v:string){return v.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/:/g,'\\:').replace(/%/g,'\\%').replace(/,/g,'\\,');}
function twoWordCues(raw:Array<{part:string;start:number;end:number}>){const w=raw.map(x=>({text:String(x.part??'').trim(),start:Number(x.start),end:Number(x.end)})).filter(x=>x.text&&Number.isFinite(x.start)&&Number.isFinite(x.end)),out:Array<{text:string;start:number;end:number}>=[];for(let i=0;i<w.length;i+=2){const a=w[i],bb=w[i+1];out.push({text:[a.text,bb?.text].filter(Boolean).join(' ').slice(0,80),start:a.start,end:bb?.end??a.end});}return out;}
async function buildMarketingVideo(imagePath:string,outputPath:string,product:any,isShort:boolean){const [width,height]=isShort?[1080,1920]:[1920,1080],dir=join(tmpdir(),`oneoffice-video-${Date.now()}-${Math.random().toString(36).slice(2)}`);mkdirSync(dir,{recursive:true});const music=join(dir,'music.wav'),voice=join(dir,'voice.mp3'),sub=voice+'.json';try{await writeMarketingWav(music);const tts=new EdgeTTS({voice:Math.random()<.5?'uz-UZ-MadinaNeural':'uz-UZ-SardorNeural',lang:'uz-UZ',outputFormat:'audio-24khz-96kbitrate-mono-mp3',saveSubtitles:true,rate:'+4%',timeout:20000});await tts.ttsPromise(narrationForProduct(product),voice);const raw=JSON.parse(await readFile(sub,'utf8')) as Array<{part:string;start:number;end:number}>,cues=twoWordCues(raw).filter(x=>x.start<15000&&x.end>0).map(x=>({...x,start:Math.max(0,x.start)/1000,end:Math.min(15000,x.end)/1000})),base=`scale=${width}:${height}:force_original_aspect_ratio=decrease,pad=${width}:${height}:(ow-iw)/2:(oh-ih)/2,setsar=1,format=yuv420p`,draw=cues.map(x=>`drawtext=text='${escapeDrawText(x.text)}':fontcolor=white:fontsize=${isShort?72:54}:font='DejaVu Sans':borderw=3:bordercolor=black@0.7:box=1:boxcolor=black@0.48:boxborderw=18:x=(w-text_w)/2:y=h*0.80:enable='between(t,${x.start.toFixed(3)},${x.end.toFixed(3)})'`).join(','),vf=draw?`${base},${draw}`:base;await execFileAsync('ffmpeg',['-loop','1','-i',imagePath,'-i',music,'-i',voice,'-filter_complex','[1:a]volume=0.16[m];[2:a]volume=1[v];[m][v]amix=inputs=2:duration=longest:dropout_transition=0:normalize=0[a]','-map','0:v:0','-map','[a]','-vf',vf,'-t','15','-r','30','-c:v','libx264','-preset','ultrafast','-crf','27','-c:a','aac','-b:a','128k','-ar','44100','-ac','2','-movflags','+faststart','-y',outputPath],{timeout:120000});}finally{await rm(dir,{recursive:true,force:true}).catch(()=>{});}}
function isReusableVideo(v:string|null|undefined){return Boolean(v?.startsWith(`${VIDEO_CACHE_VERSION}:`));}
function encodeVideoCache(b:Buffer){return `${VIDEO_CACHE_VERSION}:${b.toString('base64')}`;}
function decodeVideoCache(v:string){return Buffer.from(v.slice(`${VIDEO_CACHE_VERSION}:`.length),'base64');}

`;
          s=s.slice(0,start)+block+s.slice(end);
          s=s.replace(/buildFiveSecondVideo\(imagePath, videoPath, isShort\)/g,'buildMarketingVideo(imagePath, videoPath, product, isShort)');
          s=s.replace(/eq\(youtubeProductContentsTable\.contentHash, contentHash\),\s*/g,'');
          s=s.replace(/Buffer\.from\(cached!\.videoData!, "base64"\)/g,'decodeVideoCache(cached!.videoData!)');
          s=s.replace(/Buffer\.from\(cached\.videoData, "base64"\)/g,'decodeVideoCache(cached.videoData)');
          s=s.replace(/const videoData = \(await readFile\(videoPath\)\)\.toString\("base64"\);/g,'const videoData = encodeVideoCache(await readFile(videoPath));');
          s=s.replace(/const videoData = cached\?\.videoData \?\? \(await readFile\(videoPath\)\)\.toString\("base64"\);/g,'const videoData = videoCache?.videoData ?? encodeVideoCache(await readFile(videoPath));');
          s=s.replace(/durationSeconds: 5/g,'durationSeconds: VIDEO_DURATION_SECONDS');
          const p='let [cached] = await db.select().from(youtubeProductContentsTable).where(and(eq(youtubeProductContentsTable.productId, productId), eq(youtubeProductContentsTable.isShort, isShort))).limit(1);';
          if(s.includes(p)){s=s.replace(p,p+'\n  const videoRows = await db.select().from(youtubeProductContentsTable).where(and(eq(youtubeProductContentsTable.productId, productId), eq(youtubeProductContentsTable.isShort, isShort))).limit(20);\n  const videoCache = videoRows.find((row) => isReusableVideo(row.videoData));');s=s.replace('if (!cached?.videoData) {','if (!videoCache) {');s=s.replace('res.send(Buffer.from(cached!.videoData!, "base64"));','res.send(videoCache ? decodeVideoCache(videoCache.videoData!) : decodeVideoCache(cached!.videoData!));');}
          const pub='let [cached] = await db.select().from(youtubeProductContentsTable).where(and(eq(youtubeProductContentsTable.productId, body.productId), eq(youtubeProductContentsTable.isShort, isShort))).limit(1);';
          if(s.includes(pub)){s=s.replace(pub,pub+'\n  const videoRows = await db.select().from(youtubeProductContentsTable).where(and(eq(youtubeProductContentsTable.productId, body.productId), eq(youtubeProductContentsTable.isShort, isShort))).limit(20);\n  const videoCache = videoRows.find((row) => isReusableVideo(row.videoData));');s=s.replace('if (cached?.videoData) await writeFile(videoPath, decodeVideoCache(cached.videoData));','if (videoCache?.videoData) await writeFile(videoPath, decodeVideoCache(videoCache.videoData));');}
          s=s.replace('videoCached: Boolean(cached.videoData)','videoCached: isReusableVideo(cached.videoData)');
          fs.writeFileSync(file,s);
          NODE
          pnpm install --lockfile-only
          pnpm --filter @workspace/api-server typecheck
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/package.json pnpm-lock.yaml artifacts/api-server/src/routes/youtube.ts
          git commit -m 'feat: upgrade YouTube videos to 15s TTS and reusable cache'
          git push
          rm -f .github/upgrade-youtube-video-trigger.txt .github/one-time-youtube-video-v2-trigger.txt
          git rm -f .github/workflows/upgrade-youtube-video-engine.yml .github/workflows/oneoffice-clean-youtube-newpost-fix.yml .github/workflows/one-time-youtube-video-v2.yml 2>/dev/null || true
          git add -u
          git commit -m 'chore: remove temporary YouTube video upgrade workflows' || true
          git push || true
