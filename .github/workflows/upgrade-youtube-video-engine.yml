name: one-time-youtube-video-engine-fix
on:
  push:
    branches: [chore/remove-replit]
    paths: ['.github/upgrade-youtube-video-trigger.txt']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-replit
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Finalize video cache
        shell: bash
        run: |
          set -e
          node - <<'NODE'
          const fs=require('fs');
          const pkg='artifacts/api-server/package.json';
          const j=JSON.parse(fs.readFileSync(pkg,'utf8'));
          j.dependencies['node-edge-tts']='^1.2.10';
          fs.writeFileSync(pkg,JSON.stringify(j,null,2)+'\n');
          const file='artifacts/api-server/src/routes/youtube.ts';
          let s=fs.readFileSync(file,'utf8');
          s=s.replace('const videoData = (await readFile(videoPath)).toString("base64");','const videoData = "v3:" + (await readFile(videoPath)).toString("base64");');
          s=s.replace('if (!cached?.videoData) {','if (!cached?.videoData?.startsWith("v3:")) {');
          s=s.replace('res.send(Buffer.from(cached!.videoData!, "base64"));','res.send(Buffer.from(cached!.videoData!.slice(3), "base64"));');
          s=s.replace('if (cached?.videoData) await writeFile(videoPath, Buffer.from(cached.videoData, "base64"));','if (cached?.videoData?.startsWith("v3:")) await writeFile(videoPath, Buffer.from(cached.videoData.slice(3), "base64"));');
          s=s.replace('const videoData = cached?.videoData ?? (await readFile(videoPath)).toString("base64");','const videoData = cached?.videoData?.startsWith("v3:") ? cached.videoData : "v3:" + (await readFile(videoPath)).toString("base64");');
          s=s.replace('videoCached: Boolean(cached.videoData)','videoCached: Boolean(cached.videoData?.startsWith("v3:"))');
          fs.writeFileSync(file,s);
          NODE
          pnpm install --lockfile-only
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/package.json pnpm-lock.yaml artifacts/api-server/src/routes/youtube.ts
          git commit -m 'feat: finalize reusable 15s YouTube video cache'
          git push origin HEAD:chore/remove-replit
