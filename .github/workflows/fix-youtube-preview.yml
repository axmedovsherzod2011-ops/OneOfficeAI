name: Apply YouTube preview patch

on:
  push:
    branches: [chore/remove-replit]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-replit
          fetch-depth: 0

      - name: Patch App.tsx
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("artifacts/oneoffice-ai/src/App.tsx")
          text = path.read_text(encoding="utf-8")

          if "const [previewUrl, setPreviewUrl] = useState(\"\");" in text:
              print("Preview patch already present")
              raise SystemExit(0)

          anchor = '  const [regenerating, setRegenerating] = useState(false);\n'
          states = '''  const [regenerating, setRegenerating] = useState(false);\n  const [previewUrl, setPreviewUrl] = useState("");\n  const [previewLoading, setPreviewLoading] = useState(false);\n  const [previewError, setPreviewError] = useState("");\n'''
          if anchor not in text:
              raise SystemExit("state anchor not found")
          text = text.replace(anchor, states, 1)

          anchor = '  async function authedFetch(path: string, init: RequestInit = {}) {\n'
          preview_logic = '''  async function loadPreview() {
    if (!firebaseUser || !product?.id) return;
    setPreviewLoading(true);
    setPreviewError("");
    try {
      const token = await firebaseUser.getIdToken();
      const res = await fetch(
        apiUrl(`/api/connectors/youtube/preview?productId=${encodeURIComponent(product.id)}&isShort=${isShort ? "true" : "false"}`),
        { headers: token ? { Authorization: `Bearer ${token}` } : {} },
      );
      if (!res.ok) {
        const body = await res.json().catch(() => null);
        throw new Error(body?.error ?? "Video preview yuklanmadi.");
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      setPreviewUrl((previous) => {
        if (previous) URL.revokeObjectURL(previous);
        return url;
      });
    } catch (err: any) {
      setPreviewError(err?.message ?? "Video preview yuklanmadi.");
    } finally {
      setPreviewLoading(false);
    }
  }

  useEffect(() => {
    let objectUrl = "";
    let cancelled = false;

    async function fetchPreview() {
      if (!firebaseUser || !product?.id) return;
      setPreviewLoading(true);
      setPreviewError("");
      try {
        const token = await firebaseUser.getIdToken();
        const res = await fetch(
          apiUrl(`/api/connectors/youtube/preview?productId=${encodeURIComponent(product.id)}&isShort=${isShort ? "true" : "false"}`),
          { headers: token ? { Authorization: `Bearer ${token}` } : {} },
        );
        if (!res.ok) {
          const body = await res.json().catch(() => null);
          throw new Error(body?.error ?? "Video preview yuklanmadi.");
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        objectUrl = url;
        if (!cancelled) {
          setPreviewUrl((previous) => {
            if (previous) URL.revokeObjectURL(previous);
            return url;
          });
        } else {
          URL.revokeObjectURL(url);
        }
      } catch (err: any) {
        if (!cancelled) setPreviewError(err?.message ?? "Video preview yuklanmadi.");
      } finally {
        if (!cancelled) setPreviewLoading(false);
      }
    }

    void fetchPreview();
    return () => {
      cancelled = true;
      if (objectUrl) URL.revokeObjectURL(objectUrl);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [firebaseUser, product?.id, isShort]);

'''
          if anchor not in text:
              raise SystemExit("authedFetch anchor not found")
          text = text.replace(anchor, preview_logic + anchor, 1)

          anchor = '      setTagsStr((data.tags ?? []).join(", "));\n    } catch (err: any) {'
          if anchor not in text:
              raise SystemExit("regenerate anchor not found")
          text = text.replace(anchor, '      setTagsStr((data.tags ?? []).join(", "));\n      await loadPreview();\n    } catch (err: any) {', 1)

          anchor = '      {/* Metadata fields */}\n'
          preview_ui = '''      {/* Video preview */}
      <Glass className="p-5 space-y-4">
        <div className="flex items-center justify-between gap-3">
          <h3 className="text-white font-semibold text-sm">Video preview</h3>
          <button
            type="button"
            onClick={() => void loadPreview()}
            disabled={previewLoading}
            className="flex items-center gap-1.5 text-xs text-slate-400 hover:text-white disabled:opacity-40 transition"
          >
            {previewLoading ? <Loader2 className="h-3.5 w-3.5 animate-spin" /> : <RefreshCw className="h-3.5 w-3.5" />}
            Yangilash
          </button>
        </div>
        <div className={`w-full overflow-hidden rounded-2xl border border-white/10 bg-black/30 flex items-center justify-center ${isShort ? "aspect-[9/16] max-h-[520px] mx-auto max-w-[292px]" : "aspect-video"}`}>
          {previewUrl ? (
            <video key={previewUrl} src={previewUrl} controls playsInline preload="metadata" className="w-full h-full object-contain" />
          ) : previewLoading ? (
            <div className="flex flex-col items-center gap-2 text-slate-400 text-sm px-4 text-center py-12">
              <Loader2 className="h-6 w-6 animate-spin text-red-400" />
              <span>5 soniyalik video preview tayyorlanmoqda…</span>
            </div>
          ) : (
            <div className="flex flex-col items-center gap-2 text-slate-500 text-sm px-4 text-center py-12">
              <AlertCircle className="h-6 w-6" />
              <span>{previewError || "Video preview yuklanmadi."}</span>
              <button type="button" onClick={() => void loadPreview()} className="text-red-400 hover:text-red-300 text-xs font-medium">Qayta urinish</button>
            </div>
          )}
        </div>
        <p className="text-[11px] text-slate-500 text-center">
          Preview publish qilinadigan 5 soniyalik video bilan bir xil va cache'dan qayta ishlatiladi.
        </p>
      </Glass>

'''
          if anchor not in text:
              raise SystemExit("preview UI anchor not found")
          text = text.replace(anchor, preview_ui + anchor, 1)

          path.write_text(text, encoding="utf-8")
          print("Preview patch applied")
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/oneoffice-ai/src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: show cached YouTube video preview"
          git push origin HEAD:chore/remove-replit
