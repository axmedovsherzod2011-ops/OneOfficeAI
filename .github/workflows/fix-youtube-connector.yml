name: Fix YouTube connector
on:
  push:
    branches: [chore/remove-replit]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-replit
          fetch-depth: 0
      - name: Patch YouTube API base URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/oneoffice-ai/src/App.tsx')
          s = p.read_text()
          old = '''    const res = await fetch(path, {\n      ...init,\n      headers: {'''
          new = '''    const res = await fetch(apiUrl(path), {\n      ...init,\n      headers: {'''
          if old not in s:
              raise SystemExit('YouTube authedFetch target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/oneoffice-ai/src/App.tsx
          git diff --cached --quiet || exit 0
          git commit -m 'fix: wire YouTube connector API calls to backend'
          git push origin HEAD:chore/remove-replit
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-youtube-connector.yml
          git commit -m 'chore: remove temporary YouTube fix workflow'
          git push origin HEAD:chore/remove-replit
