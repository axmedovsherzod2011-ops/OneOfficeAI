name: Fix YouTube API target
on:
  push:
    branches: [chore/remove-replit]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-replit
          fetch-depth: 0
      - name: Patch YouTube connector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('artifacts/oneoffice-ai/src/App.tsx')
          s = p.read_text()
          start = s.index('function YoutubeConnectorCard()')
          end = s.index('\nfunction StoreConnectorCard()', start)
          block = s[start:end]
          old = 'const res = await fetch(path, {'
          new = 'const res = await fetch(apiUrl(path), {'
          if old not in block:
              raise SystemExit('YouTube authedFetch target not found')
          block = block.replace(old, new, 1)
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/oneoffice-ai/src/App.tsx
          git diff --cached --quiet || git commit -m 'fix: target YouTube connector backend requests'
          git push origin HEAD:chore/remove-replit
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-youtube-api-target.yml
          git commit -m 'chore: remove temporary YouTube API fix workflow'
          git push origin HEAD:chore/remove-replit
