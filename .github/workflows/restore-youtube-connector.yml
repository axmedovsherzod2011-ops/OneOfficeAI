name: Restore YouTube connector UI

on:
  push:
    branches:
      - chore/remove-replit

jobs:
  restore-youtube:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/remove-replit
          fetch-depth: 1

      - name: Restore YouTube card in ConnectorsPage
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("artifacts/oneoffice-ai/src/App.tsx")
          text = path.read_text(encoding="utf-8")

          if "<YoutubeConnectorCard />" in text:
              print("YouTube connector is already rendered; nothing to change.")
              raise SystemExit(0)

          # The YouTube component and its OAuth callback logic are already
          # present in this branch; the connector was only removed from the
          # ConnectorsPage render list. Put it immediately after Telegram.
          pattern = r"(\n[ \t]*<TelegramCard />)"
          updated, count = re.subn(pattern, r"\1\n      <YoutubeConnectorCard />", text, count=1)
          if count != 1:
              raise SystemExit("Could not find <TelegramCard /> in App.tsx")

          path.write_text(updated, encoding="utf-8")
          print("Restored <YoutubeConnectorCard /> in ConnectorsPage.")
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "OneOffice Agent"
          git config user.email "agent@oneoffice.ai"
          git add artifacts/oneoffice-ai/src/App.tsx
          git rm .github/workflows/restore-youtube-connector.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: restore YouTube connector UI"
          git push origin HEAD:chore/remove-replit
