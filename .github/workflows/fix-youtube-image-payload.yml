name: Fix YouTube image payload

on:
  push:
    branches:
      - chore/remove-replit

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-replit
          fetch-depth: 1

      - name: Remove browser image payload from YouTube publishing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/oneoffice-ai/src/App.tsx')
          s = p.read_text(encoding='utf-8')
          old_sig = 'function YtPublishing({ product, accountId, ytMetadata, selectedImages, onDone, onError }: any) {'
          new_sig = 'function YtPublishing({ product, accountId, ytMetadata, onDone, onError }: any) {'
          if old_sig not in s:
              raise SystemExit('YtPublishing signature not found')
          s = s.replace(old_sig, new_sig, 1)

          old_block = '''          // Send the user-selected image URLs so the backend builds the
          // slideshow from exactly those images (falls back to product.images
          // when the array is empty).
          const imageUrls = (selectedImages ?? []).map((img: any) => img.url).filter(Boolean);

'''
          new_block = '''          // The backend owns video rendering and reads the product images from
          // the database. Do not send browser-side image/base64 payloads here.

'''
          if old_block in s:
              s = s.replace(old_block, new_block, 1)
          else:
              line = '          const imageUrls = (selectedImages ?? []).map((img: any) => img.url).filter(Boolean);\n'
              if line in s:
                  s = s.replace(line, '          // The backend owns video rendering and reads the product images from the database.\n', 1)
              else:
                  raise SystemExit('imageUrls block not found')

          old_body = '              imageUrls: imageUrls.length > 0 ? imageUrls : undefined,\n'
          if old_body not in s:
              raise SystemExit('imageUrls request field not found')
          s = s.replace(old_body, '', 1)

          old_prop = '                   selectedImages={selectedImages}\n'
          if old_prop not in s:
              raise SystemExit('selectedImages prop not found')
          s = s.replace(old_prop, '', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/oneoffice-ai/src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: keep YouTube publish payload small'
          git push origin HEAD:chore/remove-replit
