name: Fix YouTube account API URL

on:
  push:
    branches:
      - chore/remove-replit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-replit
          fetch-depth: 0

      - name: Patch YouTube metadata account fetch
        shell: python
        run: |
          from pathlib import Path
          p = Path('artifacts/oneoffice-ai/src/App.tsx')
          text = p.read_text()
          start = text.index('function YtMetadataReview(')
          end = text.index('// Step 3 — upload video', start)
          section = text[start:end]
          old = 'const res = await fetch(path, {'
          new = 'const res = await fetch(apiUrl(path), {'
          if old not in section:
              if new in section:
                  print('already fixed')
              else:
                  raise SystemExit('YOUTUBE_METADATA_ACCOUNT_FETCH_ANCHOR_NOT_FOUND')
          else:
              section = section.replace(old, new, 1)
              p.write_text(text[:start] + section + text[end:])

      - name: Verify
        run: grep -q 'const res = await fetch(apiUrl(path), {' artifacts/oneoffice-ai/src/App.tsx

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/oneoffice-ai/src/App.tsx
          git diff --cached --quiet || git commit -m 'fix: use API base URL for YouTube metadata accounts'
          git push origin chore/remove-replit
          git rm -f .github/workflows/fix-youtube-account-api-url.yml
          git commit -m 'chore: remove one-time YouTube account fix workflow'
          git push origin chore/remove-replit
