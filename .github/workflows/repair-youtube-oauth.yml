name: Repair YouTube OAuth flow

on:
  push:
    branches: [chore/remove-replit]
    paths: [.github/workflows/repair-youtube-oauth.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/remove-replit

      - name: Apply targeted OAuth fixes
        shell: python
        run: |
          from pathlib import Path

          app = Path('artifacts/oneoffice-ai/src/App.tsx')
          s = app.read_text(encoding='utf-8-sig')
          old = 'fetch("/api/connectors/youtube/exchange", {'
          new = 'fetch(apiUrl("/api/connectors/youtube/exchange"), {'
          if old not in s:
              raise SystemExit('Expected YouTube exchange fetch call not found')
          s = s.replace(old, new, 1)
          app.write_text(s, encoding='utf-8')

          yt = Path('artifacts/api-server/src/routes/youtube.ts')
          s = yt.read_text(encoding='utf-8-sig')
          old = '''  const { code, redirectUri } = req.body as { code?: string; redirectUri?: string };
  if (!code || !redirectUri) { res.status(400).json({ error: "code va redirectUri majburiy." }); return; }
'''
          new = '''  const { code } = req.body as { code?: string; redirectUri?: string };
  const rawPublicUrl = (process.env.PUBLIC_APP_URL ?? "").replace(/\\/$/, "");
  const publicUrl = rawPublicUrl ? (rawPublicUrl.startsWith("http") ? rawPublicUrl : `https://${rawPublicUrl}`) : "";
  const redirectUri = publicUrl ? `${publicUrl}/` : "";
  if (!code || !redirectUri) { res.status(400).json({ error: "YouTube OAuth redirect URI serverda sozlanmagan." }); return; }
'''
          if old not in s:
              raise SystemExit('Expected YouTube exchange redirect block not found')
          s = s.replace(old, new, 1)
          yt.write_text(s, encoding='utf-8')

      - name: Verify and commit
        run: |
          grep -n 'fetch(apiUrl("/api/connectors/youtube/exchange"), {' artifacts/oneoffice-ai/src/App.tsx
          grep -n 'const redirectUri = publicUrl ? `${publicUrl}/` : "";' artifacts/api-server/src/routes/youtube.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/repair-youtube-oauth.yml
          git add artifacts/oneoffice-ai/src/App.tsx artifacts/api-server/src/routes/youtube.ts .github/workflows/repair-youtube-oauth.yml
          git commit -m "fix: harden YouTube OAuth redirect flow"
          git push origin chore/remove-replit
