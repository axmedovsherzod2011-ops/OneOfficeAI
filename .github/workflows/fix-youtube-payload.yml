name: One-time YouTube payload cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove browser image payload from YouTube publish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("artifacts/oneoffice-ai/src/App.tsx")
          text = path.read_text(encoding="utf-8")

          old_signature = 'function YtPublishing({ product, accountId, ytMetadata, selectedImages, onDone, onError }: any) {'
          new_signature = 'function YtPublishing({ product, accountId, ytMetadata, onDone, onError }: any) {'
          if old_signature not in text:
              raise SystemExit("Expected YtPublishing signature was not found; refusing to modify the file.")
          text = text.replace(old_signature, new_signature, 1)

          old_block = '''        // Send the user-selected image URLs so the backend builds the
        // slideshow from exactly those images (falls back to product.images
        // when the array is empty).
        const imageUrls = (selectedImages ?? []).map((img: any) => img.url).filter(Boolean);

'''
          new_block = '''        // The backend owns video rendering and reads the product images from
        // the database. Do not send browser-side image/base64 payloads here.

'''
          if old_block not in text:
              raise SystemExit("Expected browser image payload block was not found; refusing to modify the file.")
          text = text.replace(old_block, new_block, 1)

          old_body = '            imageUrls: imageUrls.length > 0 ? imageUrls : undefined,\n'
          if old_body not in text:
              raise SystemExit("Expected imageUrls request field was not found; refusing to modify the file.")
          text = text.replace(old_body, '', 1)

          old_invocation = '''                accountId={ytAccountId}
                ytMetadata={ytMetadata}
                selectedImages={selectedImages}
                onDone={handleYtDone}'''
          new_invocation = '''                accountId={ytAccountId}
                ytMetadata={ytMetadata}
                onDone={handleYtDone}'''
          if old_invocation not in text:
              raise SystemExit("Expected YtPublishing invocation was not found; refusing to modify the file.")
          text = text.replace(old_invocation, new_invocation, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-youtube-payload.yml
          git add artifacts/oneoffice-ai/src/App.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: stop sending browser images to YouTube publish"
          git push origin HEAD:main
